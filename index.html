<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Un libro digital sobre nuestra historia."
    >

    <title>Nuestra Historia</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <div id="escena">

        <div id="mesa">

            <main id="libro">

                <!-- ==================================
                            PORTADA
                =================================== -->

                <section id="portada">

                    <h1>
                        Nuestra Historia
                    </h1>

                    <h3>
                        Volumen I
                    </h3>

                    <p>
                        Porque algunas historias
                        nunca terminan.
                    </p>

                    <span id="abrirTexto">
                        Toca o haz clic para comenzar
                    </span>

                </section>


                <!-- ==================================
                       INTERIOR DEL LIBRO
                =================================== -->

                <section
                    id="interior"
                    class="oculto"
                >

                    <!-- Página izquierda -->

                    <article class="pagina izquierda">

                        <h2 id="tituloIzq"></h2>

                        <div
                            id="textoIzq"
                            class="contenido"
                        ></div>

                        <div
                            id="numeroIzq"
                            class="numeroPagina"
                        ></div>

                    </article>


                    <!-- Página derecha -->

                    <article class="pagina derecha">

                        <h2 id="tituloDer"></h2>

                        <div
                            id="textoDer"
                            class="contenido"
                        ></div>

                        <div
                            id="numeroDer"
                            class="numeroPagina"
                        ></div>

                    </article>

                </section>


                <!-- ==================================
                    ELEMENTO INVISIBLE PARA MEDICIÓN
                =================================== -->

                <div
                    id="medidor"
                    aria-hidden="true"
                >

                    <h2 id="tituloMedidor"></h2>

                    <div
                        id="textoMedidor"
                        class="contenido"
                    ></div>

                </div>

            </main>

        </div>

    </div>

<script src="./script.js?v=4"></script>

</body>

</html>
