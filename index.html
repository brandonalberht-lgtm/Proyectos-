<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuestra Historia</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="escena">

    <div id="mesa">

        <div id="libro">

            <!-- ==========================
                    PORTADA
            =========================== -->

            <div id="portada">

                <h1>Nuestra Historia</h1>

                <h3>Volumen I</h3>

                <p>

                    Porque algunas historias
                    nunca terminan.

                </p>

                <span id="abrirTexto">

                    Haz clic para comenzar

                </span>

            </div>

            <!-- ==========================
                  INTERIOR DEL LIBRO
            =========================== -->

            <div id="interior" class="oculto">

                <div class="pagina izquierda">

                    <div class="numeroPagina"
                         id="numeroIzq">
                        1
                    </div>

                    <h2 id="tituloIzq"></h2>

                    <div class="contenido"
                         id="textoIzq">
                    </div>

                </div>

                <div class="pagina derecha">

                    <div class="numeroPagina"
                         id="numeroDer">
                        2
                    </div>

                    <h2 id="tituloDer"></h2>

                    <div class="contenido"
                         id="textoDer">
                    </div>

                </div>

            </div>

            <!-- ==========================
                 PÁGINA INVISIBLE
                 (solo para medir texto)
            =========================== -->

            <div id="medidor">

                <h2 id="tituloMedidor"></h2>

                <div id="textoMedidor"
                     class="contenido">
                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
